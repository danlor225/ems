# Configuration nginx pour une SPA (Single Page Application).
server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # try_files : toute URL inconnue renvoie index.html
  # => c'est React Router qui gère la navigation côté client.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
