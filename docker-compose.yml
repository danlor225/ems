# ============================================================
#  EMS — Orchestration complète (dev & démo).
#  Lancer TOUTE la stack :  docker compose up -d --build
#  Lancer SEULEMENT la base (dev host) : docker compose up -d postgres
#  Arrêter : docker compose down   (garde les données)
#  Reset   : docker compose down -v (supprime les données)
# ============================================================

services:
  # ---------- Base de données PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: ems_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ems_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Adminer : interface web de la base ----------
  adminer:
    image: adminer:4
    container_name: ems_adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  # ---------- Backend NestJS ----------
  backend:
    build:
      context: ./backend
    container_name: ems_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      # En conteneur, l'hôte de la base est le nom du service "postgres".
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:3000"

  # ---------- Frontend React (servi par nginx) ----------
  frontend:
    build:
      context: ./frontend
      args:
        # URL de l'API vue par le NAVIGATEUR (sur l'hôte) : localhost.
        VITE_API_URL: http://localhost:${BACKEND_PORT}/api
    container_name: ems_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  ems_pgdata:
